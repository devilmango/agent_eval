gold_set: evidence-grounding-examples-v1
reviewed_by: example-reviewer
reviewed_at: 2026-10-15
grader:
  require_citations: true
  min_supported_token_ratio: 0.9
cases:
  - id: exact-supported-hours
    answer: "The clinic closes at 5 PM. [hours]"
    evidence:
      - id: hours
        text: "The clinic closes at 5 PM."
    expected_passed: true
  - id: multiple-supported-claims
    answer: "The clinic opens at 9 AM. [hours] It closes at 5 PM. [hours]"
    evidence:
      - id: hours
        text: "The clinic opens at 9 AM and closes at 5 PM."
    expected_passed: true
  - id: unsupported-time
    answer: "The clinic closes at 6 PM. [hours]"
    evidence:
      - id: hours
        text: "The clinic closes at 5 PM."
    expected_passed: false
  - id: missing-citation
    answer: "The clinic closes at 5 PM."
    evidence:
      - id: hours
        text: "The clinic closes at 5 PM."
    expected_passed: false
  - id: unknown-citation
    answer: "The clinic closes at 5 PM. [unverified-source]"
    evidence:
      - id: hours
        text: "The clinic closes at 5 PM."
    expected_passed: false
  - id: unsupported-added-claim
    answer: "The clinic closes at 5 PM and offers free parking. [hours]"
    evidence:
      - id: hours
        text: "The clinic closes at 5 PM."
    expected_passed: false
