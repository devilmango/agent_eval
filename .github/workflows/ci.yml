name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Validate sample run and create HTML report
        run: agent-eval run scenarios/ --responses examples/responses.jsonl --strict --format html --output agent-eval-report.html
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-python-${{ matrix.python-version }}
          path: agent-eval-report.html
          if-no-files-found: ignore
