name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Validate sample run and create HTML report
        run: agent-eval run scenarios/ --responses examples/responses.jsonl --strict --format html --output agent-eval-report.html
      - name: Check repeated-run confidence gate
        run: agent-eval repeat scenarios/ --runs examples/responses.jsonl examples/responses.jsonl --min-runs 2 --confidence 0.95 --min-pass-rate 0.60 --strict --format html --output agent-eval-stability.html
      - name: Audit scenario coverage and mutation sensitivity
        run: |
          agent-eval coverage scenarios/ --format json --output agent-eval-coverage.json
          agent-eval mutate scenarios/ --responses examples/responses.jsonl --format json --output agent-eval-mutations.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-python-${{ matrix.python-version }}
          path: |
            agent-eval-report.html
            agent-eval-stability.html
            agent-eval-coverage.json
            agent-eval-mutations.json
          if-no-files-found: ignore
