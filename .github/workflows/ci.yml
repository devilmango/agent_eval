name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[signing]"
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Validate sample run and create HTML report
        run: agent-eval run scenarios/ --responses examples/responses.jsonl --strict --format html --output agent-eval-report.html --bundle-dir agent-eval-bundle
      - name: Verify reproducible run bundle
        run: agent-eval verify-bundle agent-eval-bundle
      - name: Replay verified run bundle
        run: agent-eval replay-bundle agent-eval-bundle --strict --format json --output agent-eval-replay.json
      - name: Validate JUnit, SARIF, and evidence-grounding calibration exports
        run: |
          agent-eval run scenarios/ --responses examples/responses.jsonl --strict --format junit --output agent-eval-junit.xml
          agent-eval run scenarios/ --responses examples/responses.jsonl --strict --format sarif --output agent-eval.sarif
          agent-eval calibrate-grounding examples/evidence-grounding-gold.yaml --min-accuracy 1.0 --format json --output agent-eval-grounding-calibration.json
      - name: Validate privacy, refusal, and confirmation safety examples
        run: agent-eval run examples/safety/ --responses examples/safety/responses.jsonl --strict --format json --output agent-eval-safety.json
      - name: Validate grader fixtures and Python compatibility matrix
        run: |
          agent-eval conformance grader contains_all --suite examples/conformance/grader-suite.yaml --format json --output agent-eval-grader-conformance.json
          agent-eval conformance-matrix grader contains_all --suite examples/conformance/grader-suite.yaml --targets examples/conformance/targets.yaml --format json --output agent-eval-conformance-matrix.json
          agent-eval conformance-history record agent-eval-conformance-matrix.json --store agent-eval-conformance-history.jsonl --plugin-version 0.1.0
          agent-eval conformance-history trend agent-eval-conformance-history.jsonl --format json --output agent-eval-conformance-trend.json
      - name: Check repeated-run confidence gate
        run: agent-eval repeat scenarios/ --runs examples/responses.jsonl examples/responses.jsonl --min-runs 2 --confidence 0.95 --min-pass-rate 0.60 --strict --format html --output agent-eval-stability.html
      - name: Audit scenario coverage and mutation sensitivity
        run: |
          agent-eval coverage scenarios/ --format json --output agent-eval-coverage.json
          agent-eval mutate scenarios/ --responses examples/responses.jsonl --format json --output agent-eval-mutations.json
      - name: Check scenario version snapshot, failure analysis, and execution budgets
        run: |
          agent-eval scenario-version scenarios/ --format json --output agent-eval-scenario-version.json
          agent-eval scenario-baseline scenarios/ --baseline agent-eval-scenario-version.json --history-log agent-eval-scenario-baseline-history.jsonl --policy examples/scenario-approval-policy.yaml --format json --output agent-eval-scenario-baseline-preview.json
          agent-eval scenario-baseline scenarios/ --baseline agent-eval-scenario-version.json --history-log agent-eval-scenario-baseline-history.jsonl --policy examples/scenario-approval-policy.yaml --approve --approved-by github-actions --format json --output agent-eval-scenario-baseline-review.json
          agent-eval scenario-baseline-history agent-eval-scenario-baseline-history.jsonl --format json --output agent-eval-scenario-baseline-history.json
          agent-eval scenario-baseline-export agent-eval-scenario-version.json --output agent-eval-scenario-baseline.portable.json
          agent-eval scenario-baseline-import agent-eval-scenario-baseline.portable.json --scenarios scenarios/ --baseline agent-eval-scenario-baseline-imported.json --history-log agent-eval-scenario-baseline-import-history.jsonl --approve --approved-by github-actions --format json --output agent-eval-scenario-baseline-import.json
          agent-eval scenario-impact scenarios/ --baseline agent-eval-scenario-version.json --profile examples/release-gates.yaml --format json --output agent-eval-scenario-impact.json --github-annotations --summary-file agent-eval-scenario-impact.md
          agent-eval scenario-audit scenarios/ --max-review-age-days 90 --format json --output agent-eval-scenario-audit.json
          agent-eval triage scenarios/ --responses examples/responses.jsonl --format json --output agent-eval-triage.json
          agent-eval run scenarios/clinic_hours.yaml --responses examples/budget-responses.jsonl --strict --max-cost-usd 0.01 --max-input-tokens 100 --max-output-tokens 50 --max-p95-latency-ms 200 --format json --output agent-eval-budget.json
      - name: Check PR annotations, drift gates, and experiment matrix
        run: |
          agent-eval compare scenarios/ --baseline examples/responses-before.jsonl --candidate examples/responses.jsonl --strict --github-annotations --bootstrap-samples 500
          agent-eval monitor scenarios/ --baseline examples/responses.jsonl --current examples/responses.jsonl --max-absolute-drift 0 --format json --output agent-eval-drift.json
          agent-eval experiment scenarios/ --variant baseline=examples/responses-before.jsonl --variant candidate=examples/responses.jsonl --bootstrap-samples 500 --format json --output agent-eval-experiment.json
          agent-eval gate scenarios/ --runs examples/responses.jsonl --profile examples/release-gates.yaml --format json --output agent-eval-gates.json
      - name: Record evaluation history and create review-only scenario drafts
        run: |
          agent-eval redaction-audit examples/draft-traces.jsonl --config examples/trace-redaction.yaml --strict --format json --output agent-eval-redaction-audit.json
          agent-eval history record --bundle agent-eval-bundle --store agent-eval-history.jsonl --label ci-run
          agent-eval history record --scenarios scenarios/ --responses examples/responses.jsonl --store agent-eval-history.jsonl --label ci-run
          agent-eval history gate agent-eval-history.jsonl --profile examples/history-release-gates.yaml --label ci-run --format json --output agent-eval-history-gate.json
          agent-eval history trend agent-eval-history.jsonl --format json --output agent-eval-history-trend.json
          agent-eval history compare agent-eval-history.jsonl --label ci-run --format json --output agent-eval-history-comparison.json
          agent-eval history trend agent-eval-history.jsonl --label ci-run --format html --output agent-eval-history.html
          cp agent-eval-history.jsonl agent-eval-history-shard.jsonl
          agent-eval history merge --output agent-eval-history-merged.jsonl agent-eval-history.jsonl agent-eval-history-shard.jsonl
          agent-eval draft-scenarios examples/draft-traces.jsonl --mapping examples/draft-mapping.yaml --input-path request.user --redaction-config examples/trace-redaction.yaml --output-dir agent-eval-scenario-drafts
          agent-eval drafts list agent-eval-scenario-drafts --format json --output agent-eval-draft-review.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-python-${{ matrix.python-version }}
          path: |
            agent-eval-report.html
            agent-eval-replay.json
            agent-eval-junit.xml
            agent-eval.sarif
            agent-eval-grounding-calibration.json
            agent-eval-safety.json
            agent-eval-grader-conformance.json
            agent-eval-conformance-matrix.json
            agent-eval-conformance-history.jsonl
            agent-eval-conformance-trend.json
            agent-eval-stability.html
            agent-eval-coverage.json
            agent-eval-mutations.json
            agent-eval-scenario-version.json
            agent-eval-scenario-baseline-review.json
            agent-eval-scenario-baseline-preview.json
            agent-eval-scenario-baseline-history.json
            agent-eval-scenario-baseline-history.jsonl
            agent-eval-scenario-baseline.portable.json
            agent-eval-scenario-baseline-imported.json
            agent-eval-scenario-baseline-import-history.jsonl
            agent-eval-scenario-baseline-import.json
            agent-eval-scenario-impact.json
            agent-eval-scenario-impact.md
            agent-eval-scenario-audit.json
            agent-eval-triage.json
            agent-eval-budget.json
            agent-eval-drift.json
            agent-eval-experiment.json
            agent-eval-gates.json
            agent-eval-history.jsonl
            agent-eval-history-trend.json
            agent-eval-history-comparison.json
            agent-eval-history-gate.json
            agent-eval-history-merged.jsonl
            agent-eval-history.html
            agent-eval-redaction-audit.json
            agent-eval-draft-review.json
            agent-eval-bundle/
            agent-eval-scenario-drafts/
          if-no-files-found: ignore
