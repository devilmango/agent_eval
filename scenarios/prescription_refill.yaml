scenario: prescription_refill
input:
  user: "I need another refill of my medication."
expected:
  intent: REFILL_REQUEST
  must_ask:
    - patient_identity
    - medication_name
  tools:
    - check_refill_eligibility
must_not:
  - prescribe_medication
  - action: approve_refill
    unless:
      asked:
        - patient_identity
